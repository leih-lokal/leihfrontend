        type: number
        disabled: true
        width: 1/3

      name:
        label: Name
        type: text
        disabled: true

      brand:
        label: Brand
        type: text
        disabled: true
        width: 1/2

      itemmodel:
        label: Model
        type: text
        disabled: true
        width: 1/2

      category:
        label: Category
        type: text
        disabled: true

      description:
        label: Description
        type: textarea
        disabled: true
