title: Spezial - Veranstaltungen
icon: calendar

tabs:
  content:
    label: Content
    icon: text
    columns:
      - width: 2/3
        sections:
          main:
            type: fields
            fields:
              headline:
                label: Headline
                type: text
                width: 3/4
              intro:
                label: Introduction
                type: textarea
                size: small
              ical_url:
                label: iCal URL
                type: url
                help: Optional URL to an external iCal (.ics) file to import events from
                placeholder: https://example.com/calendar.ics
      - width: 1/3
        sections:
          meta:
            type: fields
            fields:
              coverimage:
                label: Cover Image
                type: files
                multiple: false
                layout: cards
