title: Startseite

tabs:
  hero:
    label: Hero
    columns:
      - width: 2/3
        fields:
          hero_title:
            label: Hero-Titel
            type: text
            placeholder: "SO SIEHT GEMEINSCHAFT AUS."
            help: Gro&szlig;er Titel der sich automatisch umbricht
          hero_subtext:
            label: Hero-Untertext
            type: textarea
            size: small
          hero_background_image:
            label: Hintergrundbild (optional)
            type: files
            multiple: false
            layout: cards
            size: tiny
            query: page.images
      - width: 1/3
        fields:
          hero_info:
            type: info
            label: Hero-Bereich
            text: |
              Gro&szlig;e Typografie im Grid-Layout.
              Der Titel bricht automatisch um und f&uuml;llt die verf&uuml;gbare Breite.

  projects:
    label: Projekte
    columns:
      - width: 2/3
        fields:
          projects:
            label: Projekte
            type: structure
            fields:
              title:
                label: Projekttitel
                type: text
                width: 1/2
              tagline:
                label: Untertitel/Tagline
                type: text
                width: 1/2
              background_image:
                label: Hintergrundbild
                type: files
                multiple: false
                layout: cards
                size: tiny
                query: page.images
              stats:
                label: Statistiken
                type: structure
                fields:
                  label:
                    label: Beschreibung
                    type: text
                    width: 2/3
                  value:
                    label: Wert
                    type: text
                    width: 1/3
              cta_text:
                label: Button-Text
                type: text
                width: 1/2
              cta_link:
                label: Button-Link
                type: link
                width: 1/2
      - width: 1/3
        fields:
          projects_info:
            type: info
            label: Projekte
            text: |
              Jedes Projekt erscheint als eine Zeile im Grid.
              Links: Titel + Tagline + CTA. Rechts: Bild + Stats.

  stats:
    label: Zahlen
    fields:
      stats_section_title:
        label: &Uuml;berschrift
        type: text
        placeholder: "IN ZAHLEN"
      stats:
        label: Haupt-Statistiken
        type: structure
        fields:
          value:
            label: Wert
            type: text
            width: 1/3
          label:
            label: Beschreibung
            type: text
            width: 2/3

  volunteer:
    label: Mitmachen
    fields:
      volunteer_title:
        label: &Uuml;berschrift
        type: text
        placeholder: "WIR BRAUCHEN DICH."
      volunteer_subtext:
        label: Untertext
        type: textarea
        size: small
      volunteer_cta_text:
        label: Button-Text
        type: text
        width: 1/2
        placeholder: "JETZT MITMACHEN"
      volunteer_cta_link:
        label: Button-Link
        type: link
        width: 1/2

  location:
    label: Standort
    fields:
      location_title:
        label: &Uuml;berschrift
        type: text
        placeholder: "FINDE UNS"
      location_address:
        label: Adresse
        type: text
      location_hours:
        label: &Ouml;ffnungszeiten
        type: textarea
        size: small
      location_map_embed:
        label: Karten-Embed (optional)
        type: textarea
        size: small
        help: OpenStreetMap Embed-Code
      location_contact_email:
        label: E-Mail
        type: email
        width: 1/2
      location_contact_phone:
        label: Telefon
        type: tel
        width: 1/2
