title: Content - Galerie
icon: image

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          intro:
            label: Introduction Text
            type: textarea
            size: medium
            help: Optional text above the gallery

          layout:
            label: Gallery Layout
            type: select
            options:
              grid: Grid Layout
              masonry: Masonry Layout
              justified: Justified Layout
              carousel: Carousel/Slider
              metro: Metro/Pinterest Style
            default: grid
            width: 1/2

          columns:
            label: Images per Row
            type: select
            options:
              1: 1 Column
              2: 2 Columns
              3: 3 Columns
              4: 4 Columns
              5: 5 Columns
              6: 6 Columns
            default: 3
            width: 1/2
            when:
              layout: grid

          image_aspect_ratio:
            label: Image Aspect Ratio
            type: select
            options:
              auto: Auto (Original)
              square: Square (1:1)
              landscape: Landscape (4:3)
              wide: Wide (16:9)
              portrait: Portrait (3:4)
            default: auto
            width: 1/2
            when:
              layout: grid

          gap_size:
            label: Gap Between Images
            type: select
            options:
              sm: Small
              md: Medium
              lg: Large
              xl: Extra Large
            default: md
            width: 1/2

          enable_categories:
            label: Enable Image Categories
            type: toggle
            help: Allow filtering images by category
            default: false

      files:
        type: files
        label: Gallery Images
        layout: cards
        template: gallery-image
        help: Upload images for the gallery

  sidebar:
    width: 1/3
    sections:
      subpages:
        type: pages
        label: Sub-Galleries
        help: Child pages will be displayed as separate gallery sections

      settings:
        type: fields
        fields:
          lightbox:
            label: Enable Lightbox
            type: toggle
            default: true
            help: Click images to view full-size

          show_captions:
            label: Show Captions
            type: toggle
            default: true

          lazy_load:
            label: Lazy Load Images
            type: toggle
            default: true
            help: Improves page load performance
