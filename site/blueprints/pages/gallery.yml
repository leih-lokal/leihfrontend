title: Content - Galerie
icon: image

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          intro:
            label: Introduction Text
            type: textarea
            size: medium
            help: Optional text above the gallery

          layout:
            label: Gallery Layout
            type: select
            options:
              grid: Grid Layout
              masonry: Masonry Layout
            default: grid
            width: 1/2

          columns:
            label: Images per Row
            type: select
            options:
              2: 2 Columns
              3: 3 Columns
              4: 4 Columns
            default: 3
            width: 1/2

          enable_categories:
            label: Enable Image Categories
            type: toggle
            help: Allow filtering images by category
            default: false

      files:
        type: files
        label: Gallery Images
        layout: cards
        template: gallery-image
        help: Upload images for the gallery

  sidebar:
    width: 1/3
    sections:
      subpages:
        type: pages
        label: Sub-Galleries
        help: Child pages will be displayed as separate gallery sections

      settings:
        type: fields
        fields:
          lightbox:
            label: Enable Lightbox
            type: toggle
            default: true
            help: Click images to view full-size

          show_captions:
            label: Show Captions
            type: toggle
            default: true

          lazy_load:
            label: Lazy Load Images
            type: toggle
            default: true
            help: Improves page load performance
