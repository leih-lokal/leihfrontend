title: Spezial - Leihlokal CNC

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          hours:
            label: Opening Hours
            type: structure
            sortable: false
            max: 7
            min: 7
            default:
              - day: mon
                opened: true
                open_time: 15:00
                close_time: 19:00
              - day: tue
                opened: false
              - day: wed
                opened: false
              - day: thu
                opened: true
                open_time: 15:00
                close_time: 19:00
              - day: fri
                opened: true
                open_time: 15:00
                close_time: 19:00
              - day: sat
                opened: true
                open_time: 10:00
                close_time: 14:00
              - day: sun
                opened: false
            fields:
              day:
                label: Day
                type: select
                options:
                  mon: Monday
                  tue: Tuesday
                  wed: Wednesday
                  thu: Thursday
                  fri: Friday
                  sat: Saturday
                  sun: Sunday
                width: 1/3
              opened:
                label: Opened
                type: toggle
                default: false
                text:
                  - "Closed"
                  - "Opened"
              open_time:
                label: Opening Time
                type: time
                width: 1/3
              close_time:
                label: Closing Time
                type: time
                width: 1/3
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        label: Subpages
        info: "{{ page.num }}: {{ page.title }}"
        query: page.children.filterBy("intendedTemplate", "!=", "item")
      files:
        type: files
        template: download
